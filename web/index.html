<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mail Assistant — Boxmail</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📬</text></svg>">
</head>
<body>
  <!-- Écran de connexion -->
  <div id="login-view" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-logo">📬</div>
      <h1>Mail Assistant</h1>
      <p class="muted">Gestion des boîtes Outlook/Hotmail</p>
      <form id="login-form">
        <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <!-- Application -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">📬</div>
        <div>
          <div class="brand-name">Mail Assistant</div>
          <div class="brand-sub">Vue d'ensemble</div>
        </div>
      </div>

      <div class="side-section">
        <div class="side-title">COMPTES</div>
        <nav id="accounts-nav"></nav>
        <a class="side-link" id="add-account-btn">＋ Ajouter un compte</a>
      </div>

      <div class="side-section">
        <div class="side-title">NAVIGATION</div>
        <nav>
          <a href="#/dashboard" class="side-link" data-nav="dashboard">🏠 Tableau de bord</a>
          <a href="#/operations" class="side-link" data-nav="operations">📜 Journal d'activité</a>
        </nav>
      </div>

      <div class="side-section">
        <div class="side-title">ANALYSE &amp; ACTIONS</div>
        <a href="#/replies" class="side-link" data-nav="replies">↩️ Réponses en attente
          <span class="badge orange hidden" id="replies-badge"></span></a>
        <a href="#/important" class="side-link" data-nav="important">⭐ Mails importants
          <span class="badge red hidden" id="important-badge"></span></a>
        <a href="#/followups" class="side-link" data-nav="followups">⏰ Relances à faire
          <span class="badge orange hidden" id="followups-badge"></span></a>
        <a href="#/deadlines" class="side-link" data-nav="deadlines">📅 Échéances
          <span class="badge orange hidden" id="deadlines-badge"></span></a>
      </div>

      <div class="side-footer">
        <div id="version-line" class="version-line"></div>
        <button id="logout-btn" class="btn btn-ghost">Se déconnecter</button>
      </div>
    </aside>

    <main id="main" class="main"></main>
  </div>

  <!-- Indicateur global des tâches en cours (visible sur toutes les pages) -->
  <div id="activity-chip" class="activity-chip hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
